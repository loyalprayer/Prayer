<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <!-- 禁止手機縮放，固定畫面比例 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pray to Guanyin</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none; /* 防止長按選取文字 */
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* 防止畫面上下滑動 */
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* 頂部資訊列 (浮在圖片上方) */
    #ui-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .stat-box {
      font-size: 18px;
      font-weight: bold;
    }
    #reset-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
    }

    /* 圖片容器 */
    #scene-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .scene-img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 讓圖片填滿手機螢幕 */
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.15s ease-in-out; /* 讓切換有一點點柔和感 */
      pointer-events: none;
    }
    .scene-img.active {
      opacity: 1;
    }


    /* 擲筊彈出視窗 (Modal) */
    #bwei-modal {
      display: none; /* 預設隱藏 */
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 20;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }
    .modal-box {
      background: #1c1c1e;
      border: 1px solid #444;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      color: #fff;
      width: 330px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-title {
      margin: 0 0 15px 0;
      color: #ffd700;
      font-size: 20px;
    }
    /* 固定 295x295 的圖片顯示區 */
    #bwei-img-container {
      width: 240px; /* 稍微縮小一點點以適應各種小螢幕手機，保持正方形 */
      height: 240px;
      margin: 0 auto 15px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,0.15);
    }
    #bwei-result-img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      display: none;
    }
    /* 搖晃動畫 */
    .shake-anim {
      animation: shake 0.35s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-12deg) scale(1.05); }
      75% { transform: rotate(12deg) scale(1.05); }
    }
    #bwei-result-text {
      font-size: 16px;
      min-height: 44px;
      margin-bottom: 18px;
      color: #ddd;
      line-height: 1.4;
    }
    .action-btn {
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 0 5px;
    }
    .close-btn {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 0 5px;
    }


    /* 求籤彈出視窗 */
    #lot-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 20;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }
    .lot-box {
      background: #1c1c1e;
      border: 1px solid #d4af37;
      border-radius: 20px;
      padding: 20px;
      color: #fff;
      width: 90%;
      max-width: 380px;
      max-height: 82vh; /* 限制高度，讓長文可以在裡面滑動 */
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }
    #lot-content-area {
      overflow-y: auto; /* 允許上下滑動閱讀詳解 */
      text-align: left;
      margin-bottom: 15px;
      padding-right: 5px;
      user-select: text; /* 允許籤文捲動 */
      -webkit-user-select: text;
    }
    .lot-header {
      text-align: center;
      color: #ffd700;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,215,0,0.3);
      padding-bottom: 8px;
    }
    .lot-poem {
      background: rgba(212, 175, 55, 0.12);
      border-left: 3px solid #ffd700;
      padding: 12px;
      font-size: 17px;
      line-height: 1.6;
      color: #fff;
      margin-bottom: 12px;
      text-align: center;
      font-weight: bold;
    }
    .lot-summary {
      font-size: 15px;
      color: #ddd;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .lot-full-details {
      display: none;
      font-size: 14px;
      color: #bbb;
      line-height: 1.6;
      white-space: pre-wrap; /* 保留原本 Word 的換行排版 */
      border-top: 1px dashed #555;
      padding-top: 12px;
      margin-top: 10px;
    }
    .expand-btn {
      width: 100%;
      background: rgba(255,255,255,0.1);
      color: #ffd700;
      border: 1px solid rgba(255,215,0,0.4);
      padding: 8px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    /* 底部三個浮動按鈕水平整齊排列 */
    #bwei-trigger-btn, #lot-trigger-btn, #sutra-trigger-btn {
      position: absolute;
      bottom: 30px; /* 距離底部 30px，避開 iPhone 底部橫條 */
      transform: translateX(-50%); /* 以按鈕中心點對齊 */
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      color: #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.5);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      writing-mode: horizontal-tb; /* 改回水平橫排文字 */
      letter-spacing: 1px;
      white-space: nowrap; /* 防止文字換行 */
    }
    
    /* 左、中、右 均勻分佈在底部 */
    #bwei-trigger-btn  { left: 22%; } /* 左：🌙 擲筊 */
    #lot-trigger-btn   { left: 50%; } /* 中：🎋 求籤 */
    #sutra-trigger-btn { left: 78%; } /* 右：📿 心經 */

    /* 心經彈出視窗 */
    #sutra-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(6px);
    }
    .sutra-box {
      background: #18181a;
      border: 1px solid #d4af37;
      border-radius: 20px;
      padding: 18px;
      color: #fff;
      width: 92%;
      max-width: 400px;
      height: 86vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }
    /* 經文卡拉OK顯示區 */
    #sutra-text-container {
      flex: 1;
      overflow-y: auto;
      text-align: left;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      margin-bottom: 14px;
      line-height: 2.0;
      font-size: 17px;
      border: 1px solid rgba(255, 215, 0, 0.15);
      scroll-behavior: smooth;
    }
    .sutra-word {
      display: inline-block;
      margin-right: 8px;
      padding: 2px 5px;
      border-radius: 6px;
      color: #666; /* 未唸到的經文呈暗灰色 */
      transition: all 0.2s ease;
    }
    .sutra-word.passed {
      color: #bbb; /* 已經唸過的經文呈亮白色 */
    }
    .sutra-word.active {
      color: #000; /* 正在唸的當前句子：金底黑字粗體發光！ */
      background: #ffd700;
      font-weight: bold;
      transform: scale(1.08);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
    }
    .sutra-br {
      height: 12px;
    }

    /* 底部三大法器互動區 (木魚 / 頌缽 / 滑動念珠) */
    .instruments-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .inst-btn {
      flex: 1;
      height: 95px;
      background: radial-gradient(circle, #2c2c2e 0%, #1c1c1e 100%);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 16px;
      color: #ffd700;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: transform 0.1s;
      position: relative;
      overflow: hidden;
    }
    .inst-btn:active {
      transform: scale(0.92);
      background: rgba(255, 215, 0, 0.15);
    }
    .inst-icon {
      font-size: 30px;
      margin-bottom: 4px;
    }

    /* 3D 檀木念珠滑動軌道 */
    #bead-track-wrapper {
      flex: 1;
      height: 95px;
      background: #111;
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none; /* 讓手指滑動念珠時不會動到背景 */
    }
    /* 貫穿念珠的佛繩 */
    #bead-track-wrapper::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 2px;
      background: #8b5a2b;
      transform: translateX(-50%);
    }
    #bead-strip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform 0.18s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    /* 純 CSS 繪製的 3D 立體檀木珠 */
    .wooden-bead {
      width: 26px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #cd853f, #8b4513 55%, #3e1f07 95%);
      box-shadow: 0 3px 5px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.3);
      z-index: 2;
    }
    .bead-label {
      position: absolute;
      bottom: 3px;
      font-size: 11px;
      color: #ffd700;
      background: rgba(0,0,0,0.7);
      padding: 1px 6px;
      border-radius: 8px;
      z-index: 3;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 頂部狀態列 -->
  <div id="ui-bar">
    <div class="stat-box">第 <span id="tap-count">0</span> 拜</div>
    <div class="stat-box">第 <span id="day-count">0</span> 日</div>
	<button id="reset-btn" onclick="resetDays(event)">重置</button>
  </div>
<!-- 左側中間的擲筊按鈕 -->
  <button id="bwei-trigger-btn" onclick="openBweiModal(event)">🌙 擲筊</button>

  <!-- 擲筊彈出視窗 -->
  <div id="bwei-modal" onclick="closeBweiModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 class="modal-title">請示觀音菩薩</h3>
      <div id="bwei-img-container">
        <span id="bwei-placeholder" style="color: #888; padding: 20px; font-size: 14px;">
          請在心中默念您的問題，<br>然後點擊下方「擲筊」按鈕。
        </span>
        <img id="bwei-result-img" src="" alt="Result">
      </div>
      <div id="bwei-result-text">準備請示...</div>
      <div>
        <button class="action-btn" onclick="castBwei()">🙏 擲筊 (Cast)</button>
        <button class="close-btn" onclick="closeBweiModal(event)">關閉</button>
      </div>
    </div>
  </div>
  <!-- 右側中間的求籤按鈕 -->
  <button id="lot-trigger-btn" onclick="openLotModal(event)">🎋 求籤</button>

  <!-- 求籤彈出視窗 -->
  <div id="lot-modal" onclick="closeLotModal(event)">
    <div class="lot-box" onclick="event.stopPropagation()">
      <div class="lot-header" id="lot-title">觀音菩薩靈簽</div>
      
      <!-- 籤詩內容捲動區 -->
      <div id="lot-content-area">
        <div id="lot-placeholder" style="text-align:center; color:#888; padding: 30px 10px;">
          請在心中默念您的問題或祈求，<br>然後點擊下方「抽靈籤」按鈕。
        </div>
        
        <div id="lot-result-box" style="display:none;">
          <div class="lot-poem" id="lot-poem"></div>
          <div class="lot-summary" id="lot-summary"></div>
          <button class="expand-btn" id="expand-btn" onclick="toggleFullLot()">📖 展開完整解籤與故事</button>
          <div class="lot-full-details" id="lot-full"></div>
        </div>
      </div>

      <!-- 底部按鈕 -->
      <div style="text-align: center; padding-top: 5px;">
        <button class="action-btn" onclick="drawLot()">🎋 抽靈籤 (Draw)</button>
        <button class="close-btn" onclick="closeLotModal(event)">關閉</button>
      </div>
    </div>
  </div>
  <!-- 左側下方的心經按鈕 -->
  <button id="sutra-trigger-btn" onclick="openSutraModal(event)">📿 心經</button>

  <!-- 心經與法器彈出視窗 -->
  <div id="sutra-modal" onclick="closeSutraModal(event)">
    <div class="sutra-box" onclick="event.stopPropagation()">
      <div class="lot-header" style="display:flex; justify-content:space-between; align-items:center;">
        <span>般若波羅蜜多心經</span>
        <span id="sutra-progress" style="font-size:13px; color:#aaa; font-weight:normal;">0 / 0</span>
      </div>

      <!-- 卡拉OK經文顯示區 -->
      <div id="sutra-text-container"></div>

      <!-- 三大法器操作區 -->
      <div class="instruments-bar">
        <!-- 1. 木魚按鈕 -->
        <div class="inst-btn" onclick="triggerSutraStep('muyu')">
          <div class="inst-icon">🪵</div>
          <div>敲木魚</div>
        </div>

        <!-- 2. 頌缽按鈕 -->
        <div class="inst-btn" onclick="triggerSutraStep('bowl')">
          <div class="inst-icon">🥣</div>
          <div>敲頌缽</div>
        </div>

        <!-- 3. 滑動念珠區 (可下滑或點擊) -->
        <div id="bead-track-wrapper" 
             ontouchstart="handleBeadTouchStart(event)" 
             ontouchend="handleBeadTouchEnd(event)"
             onclick="triggerSutraStep('bead')">
          <div id="bead-strip">
            <div class="wooden-bead"></div>
            <div class="wooden-bead"></div>
            <div class="wooden-bead"></div>
            <div class="wooden-bead"></div>
            <div class="wooden-bead"></div>
          </div>
          <div class="bead-label">👇 撥念珠</div>
        </div>
      </div>

      <!-- 底部控制按鈕 -->
      <div style="text-align: center;">
        <button class="close-btn" onclick="resetSutraProgress()">🔄 重頭唸</button>
        <button class="close-btn" onclick="closeSutraModal(event)">關閉</button>
      </div>
    </div>
  </div>
  <!-- 拜拜畫面 (把全部三張圖疊在一起，用 class 控制顯示哪一張，這樣切換才不會閃白畫面) -->
  <div id="scene-container" onclick="handleScreenTap(event)">
    <!-- ⚠️ 請把這裡的 src 改成你真正的圖片檔名 -->
    <img id="img-state-0" class="scene-img active" src="state1.png" alt="Unlit">
    <img id="img-state-1" class="scene-img" src="state2.png" alt="Lit">
    <img id="img-state-2" class="scene-img" src="state3.png" alt="Praying">
  </div>
  <script src="lots_data.js"></script>
  <script>
    let isLit = false; // 記錄是否已經點香
    let tapCount = 0;  // 當次拜拜點擊次數
    let prayTimer = null;

    // 1. 初始化：從手機記憶體讀取「累積天數」
    let totalDays = parseInt(localStorage.getItem('guanyin_totalDays')) || 0;
    let lastPrayDate = localStorage.getItem('guanyin_lastDate') || '';
    document.getElementById('day-count').innerText = totalDays;

    // 取得三張圖片元素
    const img0 = document.getElementById('img-state-0');
    const img1 = document.getElementById('img-state-1');
    const img2 = document.getElementById('img-state-2');

    function showImage(stateIndex) {
      img0.classList.remove('active');
      img1.classList.remove('active');
      img2.classList.remove('active');
      if (stateIndex === 0) img0.classList.add('active');
      if (stateIndex === 1) img1.classList.add('active');
      if (stateIndex === 2) img2.classList.add('active');
    }

    // 2. 處理點擊螢幕的邏輯
    function handleScreenTap(event) {
      if (!isLit) {
        // 第一次點擊：點燃香燭 (切換到圖 2)
        isLit = true;
        showImage(1);
        checkAndAddDay(); // 點香的瞬間，計算今天打卡！
      } else {
        // 後續點擊：合十拜拜 (切換到圖 3，計數 +1)
        tapCount++;
        document.getElementById('tap-count').innerText = tapCount;
        showImage(2);

        // 如果手機支援震動，給一點微小的震動回饋 (iOS Safari 不支援，Android 支援)
        if (navigator.vibrate) navigator.vibrate(30);

        // 0.6 秒後手自動放下來，回到圖 2 (點香狀態)，方便你連續點擊拜拜
        clearTimeout(prayTimer);
        prayTimer = setTimeout(() => {
          showImage(1);
        }, 600);
      }
    }

    // 3. 檢查並增加天數 (一天只會加一次)
    function checkAndAddDay() {
      const today = new Date().toDateString(); // 例如 "Thu Nov 19 2026"
      if (lastPrayDate !== today) {
        totalDays++;
        lastPrayDate = today;
        localStorage.setItem('guanyin_totalDays', totalDays);
        localStorage.setItem('guanyin_lastDate', lastPrayDate);
        document.getElementById('day-count').innerText = totalDays;
      }
    }

    // 4. 重置天數按鈕
    function resetDays(event) {
      event.stopPropagation(); // 防止觸發背景的拜拜點擊
      if (confirm('Are you sure you want to reset your prayer days to Day 0?')) {
        totalDays = 0;
        lastPrayDate = '';
        localStorage.setItem('guanyin_totalDays', 0);
        localStorage.setItem('guanyin_lastDate', '');
        document.getElementById('day-count').innerText = 0;
        
        // 順便把畫面重置回未點香狀態
        isLit = false;
        tapCount = 0;
        document.getElementById('tap-count').innerText = 0;
        showImage(0);
      }
    }

    // 5. 註冊離線服務 (Service Worker)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
	// --- 擲筊功能邏輯 ---
    function openBweiModal(event) {
      event.stopPropagation(); // 避免觸發背景的拜拜
      document.getElementById('bwei-modal').style.display = 'flex';
      // 每次打開重置回準備狀態
      document.getElementById('bwei-result-img').style.display = 'none';
      document.getElementById('bwei-placeholder').style.display = 'block';
      document.getElementById('bwei-result-text').innerHTML = '準備請示...';
    }

    function closeBweiModal(event) {
      if (event) event.stopPropagation();
      document.getElementById('bwei-modal').style.display = 'none';
    }

    function castBwei() {
      const img = document.getElementById('bwei-result-img');
      const placeholder = document.getElementById('bwei-placeholder');
      const text = document.getElementById('bwei-result-text');

      placeholder.style.display = 'none';
      img.style.display = 'block';

      // 重新觸發搖晃動畫
      img.classList.remove('shake-anim');
      void img.offsetWidth; 
      img.classList.add('shake-anim');

      // 震動回饋
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);

      // 計算機率：50% 聖筊(T), 25% 笑筊(N), 25% 陰筊(F)
      const rand = Math.random();
      if (rand < 0.5) {
        img.src = 'resultT.png';
        text.innerHTML = '<strong style="color:#4cd964; font-size:18px;">【聖筊 (True)】</strong><br>菩薩允杯，方向正確，所求順遂。';
      } else if (rand < 0.75) {
        img.src = 'resultN.png';
        text.innerHTML = '<strong style="color:#ffcc00; font-size:18px;">【笑筊 (Neutral)】</strong><br>菩薩微笑不語，請釐清問題再問一次。';
      } else {
        img.src = 'resultF.png';
        text.innerHTML = '<strong style="color:#ff3b30; font-size:18px;">【陰筊 (False)】</strong><br>菩薩不允，此事不宜或時機未到。';
      }
    }
// --- 觀音百籤 自動解析與抽籤邏輯 (修正精準版) ---
    let parsedLots = [];

    function initLotsData() {
      if (typeof RAW_LOTS_TEXT === 'undefined') return;
      parsedLots = [];
      
      // 修正：只切割帶有「吉凶宮位」的真正籤頭，不會被中間的「整體解籤」誤導！
      const parts = RAW_LOTS_TEXT.split(/(?=觀音靈簽第\d+簽[^\n]*吉凶宮位)/);
      
      parts.forEach(part => {
        if (part.trim().startsWith('觀音靈簽第') && part.includes('詩曰：')) {
          const lines = part.trim().split('\n').map(l => l.trim()).filter(l => l !== '');
          const title = lines[0]; // 第一行：籤名與吉凶
          
          const getSection = (startKey, endKey) => {
            const sIdx = part.indexOf(startKey);
            if (sIdx === -1) return '';
            const contentStart = sIdx + startKey.length;
            const eIdx = part.indexOf(endKey, contentStart);
            return eIdx !== -1 ? part.substring(contentStart, eIdx).trim() : '';
          };

          const poem = getSection('詩曰：', '詩意：').split('註：')[0].trim();
          const meaning = getSection('詩意：', '解曰：').split('註：')[0].trim();
          const explain = getSection('解曰：', '詳解').split('註：')[0].trim();
          const essence = getSection('本簽精髓：', '凡事做事：').trim();

          parsedLots.push({
            title: title,
            poem: poem,
            meaning: meaning,
            explain: explain,
            essence: essence,
            fullText: part.trim()
          });
        }
      });
      console.log('成功載入觀音靈籤共：' + parsedLots.length + ' 籤');
    }
    // 網頁載入時自動整理好 100 籤
    window.addEventListener('DOMContentLoaded', initLotsData);

    function openLotModal(event) {
      event.stopPropagation();
      document.getElementById('lot-modal').style.display = 'flex';
    }

    function closeLotModal(event) {
      if (event) event.stopPropagation();
      document.getElementById('lot-modal').style.display = 'none';
    }

    function drawLot() {
      if (parsedLots.length === 0) initLotsData();
      if (parsedLots.length === 0) {
        alert('題庫載入中，請確認 lots_data.js 已正確建立！');
        return;
      }

      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

      // 隨機抽取 1~100 籤
      const randomIndex = Math.floor(Math.random() * parsedLots.length);
      const lot = parsedLots[randomIndex];

      document.getElementById('lot-placeholder').style.display = 'none';
      document.getElementById('lot-result-box').style.display = 'block';

      document.getElementById('lot-title').innerText = lot.title;
      document.getElementById('lot-poem').innerText = lot.poem;
      document.getElementById('lot-summary').innerHTML = 
        `<b>【本簽精髓】</b> ${lot.essence}<br><br>` +
        `<b>【詩意】</b> ${lot.meaning}<br>` +
        `<b>【解曰】</b> ${lot.explain}`;
      
      document.getElementById('lot-full').innerText = lot.fullText;
      document.getElementById('lot-full').style.display = 'none';
      document.getElementById('expand-btn').innerText = '📖 展開完整解籤與故事';
      document.getElementById('lot-content-area').scrollTop = 0;
    }

    function toggleFullLot() {
      const fullDiv = document.getElementById('lot-full');
      const btn = document.getElementById('expand-btn');
      if (fullDiv.style.display === 'none') {
        fullDiv.style.display = 'block';
        btn.innerText = '🔼 收起完整解籤';
      } else {
        fullDiv.style.display = 'none';
        btn.innerText = '📖 展開完整解籤與故事';
      }
    }
	// --- 心經卡拉OK導讀與三大法器邏輯 ---
    // 已幫你把「菩薩觀自在菩薩」中間補上空格，確保每一句完美切開！
    const SUTRA_LINES = [
      "南無本師釋迦牟尼佛 南無本師釋迦牟尼佛 南無本師釋迦牟尼佛",
      "南無大悲觀世音菩薩 南無大悲觀世音菩薩 南無大悲觀世音菩薩",
      "觀自在菩薩 行深般若波羅蜜多時 照見五蘊皆空 度一切苦厄",
      "舍利子 色不異空 空不異色 色即是空 空即是色 受想行識 亦復如是",
      "舍利子 是諸法空相 不生不滅 不垢不淨 不增不減",
      "是故空中無色 無受想行識 無眼耳鼻舌身意 無色聲香味觸法 無眼界 乃至無意識界",
      "無無明 亦無無明盡 乃至無老死 亦無老死盡 無苦集滅道 無智亦無得",
      "以無所得故 菩提薩埵 依般若波羅蜜多故 心無罣礙 無罣礙故 無有恐怖 遠離顛倒夢想 究竟涅槃",
      "三世諸佛 依般若波羅蜜多故 得阿耨多羅三藐三菩提",
      "故知般若波羅蜜多 是大神咒 是大明咒 是無上咒 是無等等咒 能除一切苦 真實不虛",
      "故說般若波羅蜜多咒 即說咒曰",
      "揭諦揭諦 波羅揭諦 波羅僧揭諦 菩提薩婆訶",
      "摩訶般若波羅蜜多 摩訶般若波羅蜜多 摩訶般若波羅蜜多"
    ];

    let sutraWords = [];
    let currentSutraIndex = -1; // -1 代表還沒開始唸第一句

    function initSutra() {
      const container = document.getElementById('sutra-text-container');
      container.innerHTML = '';
      sutraWords = [];
      
      SUTRA_LINES.forEach((line, lineIdx) => {
        const phrases = line.trim().split(/\s+/);
        phrases.forEach(phrase => {
          const span = document.createElement('span');
          span.className = 'sutra-word';
          span.innerText = phrase;
          container.appendChild(span);
          sutraWords.push(span);
        });
        // 段落換行
        if (lineIdx < SUTRA_LINES.length - 1) {
          const br = document.createElement('div');
          br.className = 'sutra-br';
          container.appendChild(br);
        }
      });
      updateSutraHighlight();
    }
    window.addEventListener('DOMContentLoaded', initSutra);

    function openSutraModal(event) {
      event.stopPropagation();
      document.getElementById('sutra-modal').style.display = 'flex';
    }

    function closeSutraModal(event) {
      if (event) event.stopPropagation();
      document.getElementById('sutra-modal').style.display = 'none';
    }

    function resetSutraProgress() {
      currentSutraIndex = -1;
      updateSutraHighlight();
      document.getElementById('sutra-text-container').scrollTop = 0;
    }

    // 推進一句經文並發光
    function triggerSutraStep(type) {
      // 1. 播放對應法器的聲音與動畫
      if (type === 'muyu') {
        playMuyuSound();
      } else if (type === 'bowl') {
        playBowlSound();
      } else if (type === 'bead') {
        animateBeadSlide();
        playBeadClickSound();
      }

      if (navigator.vibrate) navigator.vibrate(25);

      // 2. 推進卡拉OK進度
      currentSutraIndex++;
      if (currentSutraIndex >= sutraWords.length) {
        // 唸完最後一句後，再按一下會重頭開始
        currentSutraIndex = 0;
      }
      updateSutraHighlight();

      // 如果剛好唸到最後一句「摩訶般若波羅蜜多」，自動敲一聲頌缽祝賀圓滿！
      if (currentSutraIndex === sutraWords.length - 1 && type !== 'bowl') {
        setTimeout(() => playBowlSound(), 300);
      }
    }

    function updateSutraHighlight() {
      if (sutraWords.length === 0) return;
      sutraWords.forEach((span, idx) => {
        span.classList.remove('active', 'passed');
        if (idx < currentSutraIndex) {
          span.classList.add('passed');
        } else if (idx === currentSutraIndex) {
          span.classList.add('active');
          // 自動把畫面捲動到正在唸的那一句
          span.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
      document.getElementById('sutra-progress').innerText = 
        `${Math.max(0, currentSutraIndex + 1)} / ${sutraWords.length}`;
    }
    // --- 數學合成「木魚 (Muyu)」音效系統 (Web Audio API) ---
    let soundEnabled = true; // 預設開啟木魚聲 (如果你希望進電梯預設靜音，可以改成 false)
    let audioCtx = null;

    function toggleSound(event) {
      event.stopPropagation(); // 防止觸發背景拜拜
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-btn');
      btn.innerText = soundEnabled ? '🔊 木魚' : '🔇 靜音';
      btn.style.opacity = soundEnabled ? '1' : '0.5';
      
      // 切換成開啟時，試敲一下讓你知道有聲音
      if (soundEnabled) playMuyuSound();
    }

    function playMuyuSound() {
      if (!soundEnabled) return;
      try {
        // 初始化音訊引擎
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        // 1. 木魚主體共鳴聲 (圓潤的「卜」聲)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        
        // 頻率在 0.08 秒內從 780Hz 滑落到 420Hz，製造空心木頭的立體感
        osc.frequency.setValueAtTime(1000, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.08);

        // 音量包絡線：瞬間敲響，0.12 秒內乾淨收尾
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.13);

        // 2. 木槌接觸表面的清脆敲擊聲 (極短促的高頻泛音)
        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.type = 'triangle';
        clickOsc.frequency.setValueAtTime(1600, now);
        clickOsc.frequency.exponentialRampToValueAtTime(600, now + 0.02);

        clickGain.gain.setValueAtTime(0.35, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

        clickOsc.connect(clickGain);
        clickGain.connect(audioCtx.destination);
        clickOsc.start(now);
        clickOsc.stop(now + 0.03);

      } catch (e) {
        console.log('Audio error:', e);
      }
    }
    // --- 數學合成「頌缽 (Singing Bowl)」音效 ---
    function playBowlSound() {
      if (typeof soundEnabled !== 'undefined' && !soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        // 基音 (528Hz 療癒頻率) + 泛音 (1460Hz) 疊加出金屬頌缽的空靈悠長共鳴
        const freqs = [528, 1460];
        const gains = [0.6, 0.2];
        const durations = [3.2, 1.8]; // 餘音繚繞 3.2 秒

        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(gains[i], now + 0.02); // 柔和敲擊感
          gain.gain.exponentialRampToValueAtTime(0.0001, now + durations[i]);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + durations[i] + 0.1);
        });
      } catch (e) { console.log(e); }
    }

    // --- 數學合成「撥動木念珠」微音效 ---
    function playBeadClickSound() {
      if (typeof soundEnabled !== 'undefined' && !soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.04);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      } catch (e) { console.log(e); }
    }

    // --- 念珠手指滑動動畫邏輯 ---
    let beadTouchStartY = 0;

    function handleBeadTouchStart(e) {
      beadTouchStartY = e.touches[0].clientY;
    }

    function handleBeadTouchEnd(e) {
      const touchEndY = e.changedTouches[0].clientY;
      // 只要手指有滑動 (無論往下滑或往上滑超過 10px)，就觸發撥念珠
      if (Math.abs(touchEndY - beadTouchStartY) > 10) {
        e.preventDefault();
        triggerSutraStep('bead');
      }
    }

    function animateBeadSlide() {
      const strip = document.getElementById('bead-strip');
      // 往下滑動一顆珠子的距離 (28px)
      strip.style.transition = 'transform 0.16s ease-out';
      strip.style.transform = 'translateY(28px)';
      
      // 動畫結束瞬間無縫歸位，製造「無限長串念珠」的視覺錯覺！
      setTimeout(() => {
        strip.style.transition = 'none';
        strip.style.transform = 'translateY(0)';
      }, 160);
    }
  </script>
